name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Layer 1: catches the actual #381 failure -- a tracked env file -- without
      # depending on what is inside it. Content rules missed those files for six
      # months because `ADMIN_API_KEY=<14 chars>` matches no vendor pattern.
      - name: Reject tracked env files
        run: bash scripts/check-tracked-env-files.sh

      # Layer 2: verify the custom rules actually fire. Values are GENERATED at
      # runtime rather than written literally, so no secret-shaped string exists
      # in this file -- an earlier draft embedded literals here and gitleaks
      # correctly flagged the workflow itself. Random values also make this a
      # stronger test than fixed ones.
      - name: Verify custom rules detect project secrets
        run: |
          set -euo pipefail
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz             | tar -xz -C /tmp gitleaks
          probe_dir="$(mktemp -d)"
          rnd() { head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c "$1"; }
          {
            printf 'ADMIN_API_KEY=%s
' "$(rnd 16)"
            printf 'SESSION_SECRET=%s
' "$(rnd 32)"
            printf 'DATABASE_URL=postgresql://%s:%s@db.internal:5432/appdb
' 'appuser' "$(rnd 20)"
          } > "$probe_dir/probe.env"

          /tmp/gitleaks detect --no-git --source "$probe_dir"             --config .gitleaks.toml --report-path /tmp/probe.json --exit-code 0 || true

          found=$(python3 -c "import json;print(len(json.load(open('/tmp/probe.json'))))" 2>/dev/null || echo 0)
          rules=$(python3 -c "import json;print(','.join(sorted({f['RuleID'] for f in json.load(open('/tmp/probe.json'))})))" 2>/dev/null || echo none)
          rm -rf "$probe_dir" /tmp/probe.json
          echo "findings: $found  rules: $rules"
          if [ "$found" -lt 3 ]; then
            echo "ERROR: expected >=3 findings (admin key, session secret, database url), got $found"
            echo "The custom rules are not matching. Do not merge."
            exit 1
          fi
          echo "OK: custom rules fire on all three probe secrets."

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: results.sarif

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: results.sarif
