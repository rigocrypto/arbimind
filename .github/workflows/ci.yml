name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject npm lockfiles changed in this PR
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '(^|/)package-lock\.json$' >/dev/null; then
            echo 'package-lock.json changes are not allowed in this pnpm workspace.'
            exit 1
          fi

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --prefer-offline

      # Audit gate: surface-scoped and baseline-differenced, so its result can
      # only change when the lockfile or the baseline changes -- never because
      # GitHub published an advisory overnight. Measured on an unmodified tree:
      # 2 unignored high across 1 package, then 5 across 3 packages hours later,
      # byte-identical lockfile. A required check that red-lights a
      # dependency-free diff is a scheduling artifact, not a security signal.
      #
      # Note there is deliberately NO endpoint-failure grep here. The previous
      # step swallowed registry errors and exited 0, which was safe under
      # always-fail-on-high semantics (a reachable audit would fail loudly next
      # run) but becomes fail-open under a filtered check, on exactly the
      # surfaces that touch keys and funds. That behaviour now lives only in the
      # scheduled job, where "endpoint was down, try tomorrow" is still correct.
      - name: Security audit (bot + backend surfaces)
        run: |
          set +e
          # 10 minute cap: a registry that accepts the connection and then hangs
          # would otherwise run to the job timeout, which can resolve green.
          timeout 600 pnpm audit --prod --json > audit-prod.json 2>audit-prod.err
          set -e
          # pnpm audit's exit code is deliberately ignored: it returns 1 both for
          # "found vulnerabilities" and for "could not reach the registry", so it
          # carries no usable information. The gate decides from payload shape.
          python3 scripts/audit_surface_gate.py audit-prod.json \
            --baseline security/audit-baseline.json
          gate_status=$?
          if [ "$gate_status" -eq 2 ]; then
            echo "::error::Audit did not run (registry unreachable, timeout, or malformed output)."
            echo "This is NOT a clean result. See audit-prod.err:"
            head -20 audit-prod.err || true
          fi
          exit "$gate_status"

      - name: Audit gate self-test
        run: python3 tests/test_audit_surface_gate.py

      # Keep the existing lint gate shape: only UI lint is currently clean on main.
      - run: pnpm --filter @arbimind/ui lint

      # UI type errors were previously invisible: `ui type-check` ran `next build`,
      # and next.config sets ignoreBuildErrors: true, so nothing validated types.
      # CI ran no typecheck step at all.
      - name: Typecheck all workspaces
        run: pnpm run typecheck

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Foundry libs
        working-directory: packages/contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v4.9.6
          forge install foundry-rs/forge-std@v1.5.0
          forge install Uniswap/v3-core@v1.0.0
          forge install Uniswap/v3-periphery@v1.3.0

      - name: Test (parallel)
        run: |
          set -euo pipefail
          pnpm --filter @arbimind/ui run test &
          ui_test_pid=$!
          pnpm --filter @arbimind/bot run test &
          bot_test_pid=$!
          pnpm --filter @arbimind/backend run test &
          backend_test_pid=$!
          wait $ui_test_pid
          wait $backend_test_pid
          wait $bot_test_pid

      - run: pnpm build

  # scripts/smoke-post-deploy.ps1 gates every production deploy and has been
  # implicated in four incidents (#366 argument binding, #369 pwsh 7 response
  # handling, #375 RequireDatabase, #377/#379 the deployed-commit gate) while
  # having no automated coverage. Runs on windows-latest with pwsh to match the
  # environment the smoke workflows actually use.
  powershell-smoke-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tests diff real commits from history to verify the backend-relevance
          # rule; a shallow clone makes those assertions unrunnable.
          fetch-depth: 0

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Write-Host "Pester $((Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version)"

      - name: Run Pester suite
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './scripts/tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
