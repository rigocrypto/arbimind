name: Nightly Smoke

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Validate required secrets
        shell: pwsh
        env:
          BACKEND_BASE: ${{ secrets.BACKEND_BASE }}
          UI_BASE: ${{ secrets.UI_BASE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BACKEND_BASE)) {
            throw 'Missing required secret: BACKEND_BASE'
          }
          if ([string]::IsNullOrWhiteSpace($env:UI_BASE)) {
            throw 'Missing required secret: UI_BASE'
          }

      - name: Run nightly smoke
        id: smoke
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        env:
          BACKEND_BASE: ${{ secrets.BACKEND_BASE }}
          UI_BASE: ${{ secrets.UI_BASE }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          [void][scriptblock]::Create((Get-Content ./scripts/smoke-post-deploy.ps1 -Raw))

          # Must be a hashtable: splatting an ARRAY binds positionally, so the
          # '-BackendBase' string itself lands in $BackendBase and the real URL
          # lands in $AdminKey. See #294.
          # RequireDatabase: production must not score a green run when the
          # backend has no database. Without it every DB-backed check reports
          # "skipped (DATABASE_URL not set)" and passes. See #370.
          $smokeArgs = @{
            BackendBase     = $env:BACKEND_BASE
            UiBase          = $env:UI_BASE
            RequireDatabase = $true
          }

          if (-not [string]::IsNullOrWhiteSpace($env:ADMIN_API_KEY)) {
            $smokeArgs['AdminKey'] = $env:ADMIN_API_KEY
          }

          & ./scripts/smoke-post-deploy.ps1 @smokeArgs *>&1 | Tee-Object -FilePath smoke.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build smoke log excerpt
        id: excerpt
        if: always()
        shell: pwsh
        run: |
          if (Test-Path smoke.log) {
            $tail = (Get-Content smoke.log -Tail 80) -join "`n"
          } else {
            $tail = 'No smoke.log captured.'
          }

          "tail<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $tail | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upsert failure tracking issue
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          BACKEND_BASE: ${{ secrets.BACKEND_BASE }}
          UI_BASE: ${{ secrets.UI_BASE }}
          LOG_TAIL: ${{ steps.excerpt.outputs.tail }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'CI: recurring nightly smoke failures';
            const logTail = process.env.LOG_TAIL || '';

            // Known backend defect tracked separately from smoke plumbing. See #370.
            const ANALYTICS_ISSUE = 370;
            const ANALYTICS_SIGNATURE = /Analytics ingest|Analytics CTA A\/B report|\/api\/analytics|Failed to build CTA A\/B report/i;

            // Summary rows render as "<check name>   FAIL   <detail>". Match the
            // uppercase word only, so "N check(s) failed." is not counted.
            const failLines = logTail.split('\n').filter(l => /\bFAIL\b/.test(l));
            const analyticsFails = failLines.filter(l => ANALYTICS_SIGNATURE.test(l));
            const otherFails = failLines.filter(l => !ANALYTICS_SIGNATURE.test(l));

            // Route to the analytics issue only when analytics is the sole cause.
            // A mixed run (e.g. analytics + RPC) must not be filed as an analytics bug.
            const analyticsOnly = analyticsFails.length > 0 && otherFails.length === 0;

            const failingChecks = failLines.length
              ? failLines.map(l => `- \`${l.trim()}\``).join('\n')
              : '- (no per-check FAIL lines captured)';

            const failureNote = [
              `❌ Nightly smoke failed. @ops`,
              `- Time (UTC): ${new Date().toISOString()}`,
              `- Backend: ${process.env.BACKEND_BASE}`,
              `- UI: ${process.env.UI_BASE}`,
              `- Workflow run: ${runUrl}`,
              '',
              '### Failing checks',
              failingChecks,
              '',
              '### Log excerpt',
              '```',
              logTail || 'No logs captured.',
              '```'
            ].join('\n');

            const comment = (issue_number, body) => github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });

            if (analyticsOnly) {
              let analyticsIssue = null;
              try {
                const { data } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: ANALYTICS_ISSUE
                });
                analyticsIssue = data;
              } catch (err) {
                core.info(`Could not fetch #${ANALYTICS_ISSUE}: ${err.message}`);
              }

              if (analyticsIssue && analyticsIssue.state === 'open' && /analytics/i.test(analyticsIssue.title)) {
                core.info(`Analytics-only failure; commenting on #${ANALYTICS_ISSUE}.`);
                await comment(ANALYTICS_ISSUE, failureNote);
                return;
              }

              core.info(`#${ANALYTICS_ISSUE} is not an open analytics issue; falling back to the generic tracker.`);
            }

            // Search every state. Looking only at open issues meant a closed
            // tracker silently produced a duplicate with the same title.
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            const tracker = allIssues.find(i => i.title === title && !i.pull_request);

            if (!tracker) {
              const body = [
                'This issue tracks recurring nightly smoke failures.',
                '',
                'The workflow appends each failing run as a comment to avoid issue spam.',
                '',
                '### Latest failure',
                failureNote
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              return;
            }

            // Comment on a closed tracker rather than reopening it or creating a
            // duplicate. Reopening would blur the resolved plumbing history (#294).
            if (tracker.state !== 'open') {
              core.warning(`Nightly smoke failed but tracker #${tracker.number} is closed. Commenting without reopening.`);
            }

            await comment(tracker.number, failureNote);

      - name: Notify failure webhook
        if: steps.smoke.outcome == 'failure'
        shell: pwsh
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          BACKEND_BASE: ${{ secrets.BACKEND_BASE }}
          UI_BASE: ${{ secrets.UI_BASE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ALERT_WEBHOOK_URL)) {
            Write-Host 'ALERT_WEBHOOK_URL not set, skipping notification.'
            exit 0
          }

          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $msg = "🚨 Nightly smoke FAILED. @ops Backend: $($env:BACKEND_BASE) | UI: $($env:UI_BASE) | Run: $runUrl"

          if ($env:ALERT_WEBHOOK_URL -match 'discord(?:app)?\.com/api/webhooks') {
            $payload = @{ content = $msg } | ConvertTo-Json -Compress
          }
          else {
            $payload = @{ text = $msg } | ConvertTo-Json -Compress
          }

          Invoke-RestMethod -Uri $env:ALERT_WEBHOOK_URL -Method Post -ContentType 'application/json' -Body $payload

      - name: Comment green and close failure tracker
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'CI: recurring nightly smoke failures';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const tracker = issues.find(i => i.title === title);

            if (!tracker) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: tracker.number,
              body: `✅ Green: nightly smoke passed. Run: ${runUrl}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: tracker.number,
              state: 'closed'
            });
